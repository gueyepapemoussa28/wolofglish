<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1720" />
  <title>Wolofglish — Ton coach d'anglais en wolof</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>" />
  <style>
    :root {
      --bg: #0f1720;
      --bg-soft: #17222e;
      --card: #1c2836;
      --card-border: #2b3a4c;
      --text: #eef3f8;
      --text-dim: #9aabbd;
      --accent: #f4a259;
      --accent-soft: rgba(244, 162, 89, 0.14);
      --green: #4fc3a1;
      --red: #e56b6f;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --barre: 148px;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      position: relative;
    }

    /* ---------- En-tête ---------- */
    header {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      padding-top: calc(14px + env(safe-area-inset-top));
      border-bottom: 1px solid var(--card-border);
      background: var(--bg);
    }

    .marque { display: flex; align-items: center; gap: 10px; min-width: 0; }

    .pastille {
      width: 38px; height: 38px;
      border-radius: 12px;
      background: var(--accent-soft);
      display: flex; align-items: center; justify-content: center;
      font-size: 19px;
      flex: none;
    }

    .marque h1 {
      font-size: 17px;
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .marque p {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--text-dim);
    }

    .actions { display: flex; gap: 7px; flex: none; }

    .btn-entete {
      background: none;
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 12px;
      font-family: var(--font);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-entete:active { color: var(--text); border-color: var(--accent); }

    #btnVoix { font-size: 15px; line-height: 1; padding: 7px 10px; }

    #btnVoix.actif { border-color: var(--accent); color: var(--accent); }

    /* ---------- Fil de conversation ---------- */
    #fil {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px 16px calc(var(--barre) + 20px);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .bulle { animation: apparait 0.32s ease both; max-width: 100%; }

    @keyframes apparait {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    /* Ce que l'utilisateur a dit */
    .moi {
      align-self: flex-end;
      max-width: 82%;
      background: var(--accent-soft);
      border: 1px solid rgba(244, 162, 89, 0.25);
      border-radius: 18px 18px 4px 18px;
      padding: 12px 15px;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
    }

    /* Réponse du coach */
    .coach { align-self: flex-start; width: 100%; }

    .coach-entete {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .coach-entete .point {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .coach-dit {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px 18px 18px 4px;
      padding: 14px 16px;
      font-size: 16px;
      line-height: 1.6;
      position: relative;
    }

    .coach-dit .ecouter {
      margin-top: 10px;
      background: none;
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      border-radius: 9px;
      padding: 5px 10px;
      font-size: 12px;
      font-family: var(--font);
      cursor: pointer;
    }

    .coach-dit .ecouter:active { color: var(--text); }

    /* La phrase anglaise à retenir */
    .phrase {
      margin-top: 12px;
      background: linear-gradient(150deg, rgba(244, 162, 89, 0.16), rgba(244, 162, 89, 0.06));
      border: 1px solid rgba(244, 162, 89, 0.32);
      border-radius: 16px;
      padding: 16px;
    }

    .phrase-titre {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .phrase-texte {
      font-size: 21px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.01em;
      margin: 0;
    }

    .phrase button {
      margin-top: 12px;
      width: 100%;
      background: var(--accent);
      color: #12202c;
      border: none;
      border-radius: 11px;
      padding: 11px;
      font-size: 14px;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .phrase button:active { transform: scale(0.98); }

    /* La nuance wolof -> anglais */
    .nuance {
      margin-top: 12px;
      background: rgba(79, 195, 161, 0.09);
      border-left: 3px solid var(--green);
      border-radius: 0 12px 12px 0;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.6;
      color: #cfe8e0;
    }

    .nuance-titre {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 6px;
    }

    /* Accueil */
    .accueil {
      margin: auto 0;
      text-align: center;
      padding: 30px 10px;
    }

    .accueil .grand { font-size: 46px; margin-bottom: 14px; }

    .accueil h2 {
      font-size: 21px;
      margin: 0 0 10px;
      font-weight: 700;
    }

    .accueil p {
      margin: 0 auto;
      max-width: 300px;
      color: var(--text-dim);
      font-size: 15px;
      line-height: 1.6;
    }

    /* Erreur */
    .souci {
      align-self: stretch;
      background: rgba(229, 107, 111, 0.12);
      border: 1px solid rgba(229, 107, 111, 0.34);
      border-radius: 14px;
      padding: 13px 15px;
      color: #ffd9da;
      font-size: 14px;
      line-height: 1.55;
    }

    .souci strong { display: block; margin-bottom: 3px; color: #fff; }

    /* ---------- Barre du micro ---------- */
    .barre {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 14px 16px calc(18px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 62%, rgba(15, 23, 32, 0));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      pointer-events: none;
    }

    .barre > * { pointer-events: auto; }

    .micro-zone {
      position: relative;
      width: 76px; height: 76px;
      display: flex; align-items: center; justify-content: center;
    }

    .onde {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      pointer-events: none;
    }

    body.enregistre .onde { animation: onde 1.8s ease-out infinite; }
    body.enregistre .onde.retard { animation-delay: 0.9s; }

    @keyframes onde {
      0% { transform: scale(0.8); opacity: 0.4; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    #micro {
      position: relative;
      width: 68px; height: 68px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: linear-gradient(160deg, #f6b478, var(--accent));
      color: #12202c;
      box-shadow: 0 10px 26px rgba(244, 162, 89, 0.3);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.18s, background 0.25s, box-shadow 0.25s;
      -webkit-tap-highlight-color: transparent;
    }

    #micro:active { transform: scale(0.93); }

    #micro:disabled {
      cursor: not-allowed;
      background: linear-gradient(160deg, #3a4a5c, #2b3a4c);
      color: var(--text-dim);
      box-shadow: none;
    }

    body.enregistre #micro {
      background: linear-gradient(160deg, #f08a8e, var(--red));
      box-shadow: 0 10px 26px rgba(229, 107, 111, 0.34);
      color: #fff;
    }

    #micro svg { width: 28px; height: 28px; }

    .roue {
      width: 25px; height: 25px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: tourne 0.9s linear infinite;
    }

    @keyframes tourne { to { transform: rotate(360deg); } }

    #etat {
      font-size: 14px;
      color: var(--text-dim);
      text-align: center;
      min-height: 19px;
      font-variant-numeric: tabular-nums;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="app">

    <header>
      <div class="marque">
        <div class="pastille">🎙️</div>
        <div>
          <h1>Wolofglish</h1>
          <p>Sa coach anglais, ci wolof</p>
        </div>
      </div>
      <div class="actions">
        <button id="btnVoix" class="btn-entete actif" type="button" aria-label="Couper la voix du coach">🔊</button>
        <button id="btnReset" class="btn-entete" type="button">Recommencer</button>
      </div>
    </header>

    <main id="fil">
      <div class="accueil" id="accueil">
        <div class="grand">👋</div>
        <h2>Salamaalekum !</h2>
        <p>Man mi, sa coach anglais laa. Wax ma ci wolof — lu la neex — te dinaa la wax nan ñu koy wax ci anglais.</p>
      </div>
    </main>

    <div class="barre">
      <div class="micro-zone">
        <span class="onde"></span>
        <span class="onde retard"></span>
        <button id="micro" type="button" aria-label="Parler">
          <svg id="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
          <span id="roue" class="roue" hidden></span>
        </button>
      </div>
      <p id="etat">Wax ma ci wolof</p>
    </div>

  </div>

  <script>
  (function () {
    "use strict";

    /* ==================================================================
       1. CONFIGURATION
       ================================================================== */

    var API_URL =
      location.protocol === "file:" || location.hostname === ""
        ? "https://wolofglish.vercel.app/api/translate"
        : "/api/translate";

    var MAX_DUREE_MS = 45000;   // arrêt automatique de l'enregistrement
    var TAUX_CIBLE = 16000;     // fréquence native des modèles de parole
    var CLE_STOCKAGE = "wolofglish.conversation.v1";
    var MAX_TOURS_MEMOIRE = 12; // ce que le coach garde en tête

    /* ==================================================================
       2. ÉLÉMENTS
       ================================================================== */

    var fil = document.getElementById("fil");
    var accueil = document.getElementById("accueil");
    var micro = document.getElementById("micro");
    var icone = document.getElementById("icone");
    var roue = document.getElementById("roue");
    var etatEl = document.getElementById("etat");
    var btnReset = document.getElementById("btnReset");
    var btnVoix = document.getElementById("btnVoix");

    /* ==================================================================
       3. ÉTAT
       ================================================================== */

    var mediaRecorder = null;
    var morceaux = [];
    var flux = null;
    var etat = "repos"; // repos | enregistre | envoie
    var chrono = null;
    var arretAuto = null;
    var debut = 0;
    var conversation = charger();
    var voixActive = chargerVoix();

    /* ==================================================================
       4. MÉMOIRE DE LA CONVERSATION
       ================================================================== */

    function chargerVoix() {
      try {
        return localStorage.getItem("wolofglish.voix") !== "0";
      } catch (err) {
        return true;
      }
    }

    function charger() {
      try {
        var brut = localStorage.getItem(CLE_STOCKAGE);
        var liste = brut ? JSON.parse(brut) : [];
        return Array.isArray(liste) ? liste : [];
      } catch (err) {
        return [];
      }
    }

    function sauver() {
      try {
        localStorage.setItem(CLE_STOCKAGE, JSON.stringify(conversation.slice(-40)));
      } catch (err) {
        // Navigation privée ou stockage plein : la conversation vit
        // alors le temps de la session, sans que rien ne casse.
      }
    }

    // Ce qu'on renvoie au coach pour qu'il garde le fil.
    function historiquePourCoach() {
      return conversation.slice(-MAX_TOURS_MEMOIRE).map(function (tour) {
        if (tour.role === "moi") {
          return { role: "user", texte: tour.wolof };
        }
        var texte = tour.coach;
        if (tour.anglais) texte += " [phrase enseignée : " + tour.anglais + "]";
        return { role: "coach", texte: texte };
      });
    }

    /* ==================================================================
       5. AFFICHAGE DU FIL
       ================================================================== */

    function creer(balise, classe, texte) {
      var el = document.createElement(balise);
      if (classe) el.className = classe;
      if (texte) el.textContent = texte;
      return el;
    }

    function afficherMoi(texteWolof) {
      var bulle = creer("div", "bulle moi", texteWolof);
      fil.appendChild(bulle);
      return bulle;
    }

    function afficherCoach(tour) {
      var bloc = creer("div", "bulle coach");

      var entete = creer("div", "coach-entete");
      entete.appendChild(creer("span", "point"));
      entete.appendChild(document.createTextNode("Coach bi"));
      bloc.appendChild(entete);

      var dit = creer("div", "coach-dit");
      dit.appendChild(creer("p", null, tour.coach));

      // Le wolof n'est synthétisé par aucun service : on le fait lire par
      // une voix française. L'orthographe wolof étant proche du français,
      // le résultat reste compréhensible.
      if ("speechSynthesis" in window && tour.coach) {
        var ecouter = creer("button", "ecouter", "🔊 Écouter en wolof");
        ecouter.addEventListener("click", function () {
          parler(tour.coach, "fr-FR", 0.95);   // toujours audible, même voix coupée
        });
        dit.appendChild(ecouter);
      }
      bloc.appendChild(dit);

      if (tour.anglais) {
        var phrase = creer("div", "phrase");
        phrase.appendChild(creer("div", "phrase-titre", "À dire en anglais"));
        phrase.appendChild(creer("p", "phrase-texte", tour.anglais));

        var bouton = creer("button", null, "🔊 Écouter la prononciation");
        bouton.addEventListener("click", function () {
          jouerAnglais(tour);
        });
        phrase.appendChild(bouton);
        bloc.appendChild(phrase);
      }

      if (tour.nuance) {
        var nuance = creer("div", "nuance");
        nuance.appendChild(creer("div", "nuance-titre", "Xam-xam — à retenir"));
        nuance.appendChild(creer("p", null, tour.nuance));
        bloc.appendChild(nuance);
      }

      fil.appendChild(bloc);
      return bloc;
    }

    function afficherSouci(titre, message) {
      var boite = creer("div", "bulle souci");
      boite.appendChild(creer("strong", null, titre));
      boite.appendChild(document.createTextNode(message));
      fil.appendChild(boite);
      descendre();
    }

    function descendre() {
      requestAnimationFrame(function () {
        fil.scrollTop = fil.scrollHeight;
      });
    }

    function redessiner() {
      Array.prototype.slice.call(fil.querySelectorAll(".bulle")).forEach(function (el) {
        el.remove();
      });
      accueil.hidden = conversation.length > 0;
      conversation.forEach(function (tour) {
        if (tour.role === "moi") afficherMoi(tour.wolof);
        else afficherCoach(tour);
      });
      descendre();
    }

    /* ==================================================================
       6. LA VOIX
       ================================================================== */

    var audioEnCours = null;

    function parler(texte, langue, vitesse, ensuite) {
      if (!("speechSynthesis" in window) || !texte) {
        if (ensuite) ensuite();
        return;
      }

      var enonce = new SpeechSynthesisUtterance(texte);
      enonce.lang = langue;
      enonce.rate = vitesse || 1;

      var prefixe = langue.split("-")[0];
      var voix = (window.speechSynthesis.getVoices() || []).filter(function (v) {
        return v.lang && v.lang.toLowerCase().indexOf(prefixe) === 0;
      });
      if (voix.length > 0) enonce.voice = voix[0];

      // On enchaîne à la fin, ou tout de suite si la synthèse échoue,
      // pour que le wolof et l'anglais ne se coupent jamais la parole.
      var suivi = false;
      function poursuivre() {
        if (suivi) return;
        suivi = true;
        if (ensuite) ensuite();
      }
      enonce.onend = poursuivre;
      enonce.onerror = poursuivre;

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(enonce);
    }

    // Le wolof n'est synthétisé par aucun fournisseur. L'orthographe wolof
    // suivant de près les conventions françaises, une voix française en donne
    // une approximation compréhensible. Réglable par l'interrupteur d'entête.
    function parlerWolof(texte, ensuite) {
      if (!voixActive) {
        if (ensuite) ensuite();
        return;
      }
      parler(texte, "fr-FR", 0.95, ensuite);
    }

    // iOS n'autorise la synthèse qu'après un geste de l'utilisateur : on la
    // débloque dès le premier appui sur le micro, avant tout appel réseau.
    var voixDebloquee = false;
    function debloquerVoix() {
      if (voixDebloquee || !("speechSynthesis" in window)) return;
      voixDebloquee = true;
      try {
        var vide = new SpeechSynthesisUtterance(" ");
        vide.volume = 0;
        window.speechSynthesis.speak(vide);
      } catch (err) {
        // Sans importance : la voix se contentera du bouton manuel.
      }
    }

    function jouerAnglais(tour) {
      if (window.speechSynthesis) window.speechSynthesis.cancel();

      if (tour.audioBase64) {
        if (audioEnCours) audioEnCours.pause();
        audioEnCours = new Audio("data:audio/mpeg;base64," + tour.audioBase64);
        var lecture = audioEnCours.play();
        if (lecture && lecture.catch) {
          lecture.catch(function () {
            parler(tour.anglais, "en-US", 0.9);
          });
        }
        return;
      }
      parler(tour.anglais, "en-US", 0.9);
    }

    /* ==================================================================
       7. CONVERSION EN WAV 16 kHz MONO
       Les moteurs de parole attendent du wav ; le navigateur enregistre
       du webm (Chrome, Android) ou du mp4 (Safari, iPhone).
       ================================================================== */

    function encoderWav(echantillons, taux) {
      var tailleDonnees = echantillons.length * 2;
      var tampon = new ArrayBuffer(44 + tailleDonnees);
      var vue = new DataView(tampon);

      function ecrire(position, texte) {
        for (var i = 0; i < texte.length; i++) vue.setUint8(position + i, texte.charCodeAt(i));
      }

      ecrire(0, "RIFF");
      vue.setUint32(4, 36 + tailleDonnees, true);
      ecrire(8, "WAVE");
      ecrire(12, "fmt ");
      vue.setUint32(16, 16, true);
      vue.setUint16(20, 1, true);
      vue.setUint16(22, 1, true);
      vue.setUint32(24, taux, true);
      vue.setUint32(28, taux * 2, true);
      vue.setUint16(32, 2, true);
      vue.setUint16(34, 16, true);
      ecrire(36, "data");
      vue.setUint32(40, tailleDonnees, true);

      var position = 44;
      for (var j = 0; j < echantillons.length; j++) {
        var valeur = Math.max(-1, Math.min(1, echantillons[j]));
        vue.setInt16(position, valeur < 0 ? valeur * 0x8000 : valeur * 0x7fff, true);
        position += 2;
      }
      return new Blob([tampon], { type: "audio/wav" });
    }

    function convertirEnWav(blob) {
      var Contexte = window.AudioContext || window.webkitAudioContext;
      var HorsEcran = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      if (!Contexte || !HorsEcran) return Promise.reject(new Error("Web Audio indisponible"));

      return blob.arrayBuffer().then(function (brut) {
        var contexte = new Contexte();
        return new Promise(function (ok, ko) {
          contexte.decodeAudioData(brut, ok, ko); // forme comprise par tous les Safari
        })
          .then(function (decode) {
            if (contexte.close) contexte.close();
            var longueur = Math.max(1, Math.ceil(decode.duration * TAUX_CIBLE));
            var horsEcran = new HorsEcran(1, longueur, TAUX_CIBLE);
            var source = horsEcran.createBufferSource();
            source.buffer = decode;
            source.connect(horsEcran.destination);
            source.start(0);

            var rendu = horsEcran.startRendering();
            if (rendu && rendu.then) return rendu;
            return new Promise(function (ok) {
              horsEcran.oncomplete = function (evt) { ok(evt.renderedBuffer); };
            });
          })
          .then(function (fini) {
            return encoderWav(fini.getChannelData(0), TAUX_CIBLE);
          });
      });
    }

    function versBase64(blob) {
      return blob.arrayBuffer().then(function (tampon) {
        var octets = new Uint8Array(tampon);
        var binaire = "";
        var paquet = 0x8000;
        for (var i = 0; i < octets.length; i += paquet) {
          binaire += String.fromCharCode.apply(null, octets.subarray(i, i + paquet));
        }
        return btoa(binaire);
      });
    }

    /* ==================================================================
       8. ENREGISTREMENT
       ================================================================== */

    function setEtat(nouveau) {
      etat = nouveau;
      document.body.classList.toggle("enregistre", nouveau === "enregistre");
      var charge = nouveau === "envoie";
      roue.hidden = !charge;
      icone.style.display = charge ? "none" : "block";
      micro.disabled = charge;
      micro.setAttribute(
        "aria-label",
        nouveau === "enregistre" ? "Arrêter et envoyer" : nouveau === "envoie" ? "Le coach réfléchit" : "Parler"
      );
    }

    function dire(texte) { etatEl.textContent = texte; }

    function meilleurFormat() {
      var liste = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
      if (typeof MediaRecorder === "undefined" || !MediaRecorder.isTypeSupported) return "";
      for (var i = 0; i < liste.length; i++) {
        if (MediaRecorder.isTypeSupported(liste[i])) return liste[i];
      }
      return "";
    }

    function demarrer() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        afficherSouci("Micro indisponible", "Ton navigateur ne permet pas d'enregistrer. Essaie Chrome ou Safari à jour, en HTTPS.");
        return;
      }

      dire("J'ouvre le micro…");

      navigator.mediaDevices
        .getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
        .then(function (micFlux) {
          flux = micFlux;
          morceaux = [];

          var format = meilleurFormat();
          try {
            mediaRecorder = format ? new MediaRecorder(flux, { mimeType: format }) : new MediaRecorder(flux);
          } catch (e) {
            mediaRecorder = new MediaRecorder(flux);
          }

          mediaRecorder.addEventListener("dataavailable", function (evt) {
            if (evt.data && evt.data.size > 0) morceaux.push(evt.data);
          });

          mediaRecorder.addEventListener("stop", function () {
            libererMicro();
            var blob = new Blob(morceaux, { type: mediaRecorder.mimeType || "audio/webm" });
            morceaux = [];
            envoyer(blob);
          });

          mediaRecorder.start();
          setEtat("enregistre");
          debut = Date.now();
          dire("J'écoute… appuie pour envoyer");

          chrono = setInterval(function () {
            var s = Math.floor((Date.now() - debut) / 1000);
            dire("J'écoute… " + String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"));
          }, 500);

          arretAuto = setTimeout(function () {
            if (etat === "enregistre") arreter();
          }, MAX_DUREE_MS);
        })
        .catch(function (err) {
          setEtat("repos");
          dire("Wax ma ci wolof");
          if (err && (err.name === "NotAllowedError" || err.name === "SecurityError")) {
            afficherSouci("Micro bloqué", "Autorise l'accès au micro dans les réglages de ton navigateur, puis réessaie.");
          } else if (err && err.name === "NotFoundError") {
            afficherSouci("Aucun micro détecté", "Vérifie les réglages de ton appareil.");
          } else {
            afficherSouci("Impossible d'ouvrir le micro", (err && err.message) || "Erreur inconnue.");
          }
        });
    }

    function arreter() {
      clearTimeout(arretAuto);
      clearInterval(chrono);
      arretAuto = null;
      chrono = null;
      setEtat("envoie");
      dire("Coach bi dafay xalaat…");
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    }

    function libererMicro() {
      if (flux) {
        flux.getTracks().forEach(function (piste) { piste.stop(); });
        flux = null;
      }
    }

    /* ==================================================================
       9. ÉCHANGE AVEC LE COACH
       ================================================================== */

    function envoyer(blob) {
      if (!blob || blob.size < 1000) {
        setEtat("repos");
        dire("Je n'ai rien entendu, réessaie");
        return;
      }

      var memoire = historiquePourCoach();

      convertirEnWav(blob)
        .catch(function () { return blob; })
        .then(function (pret) {
          var type = (pret.type || "audio/wav").split(";")[0];
          return versBase64(pret).then(function (base64) {
            return fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ audioBase64: base64, mimeType: type, historique: memoire })
            });
          });
        })
        .then(function (reponse) {
          return reponse.text().then(function (texte) {
            var donnees = null;
            try { donnees = JSON.parse(texte); } catch (e) { donnees = null; }
            if (!reponse.ok) {
              var bouts = donnees ? [donnees.error, donnees.details].filter(Boolean) : [];
              throw new Error(bouts.join(" — ").slice(0, 400) || texte.slice(0, 300) || "Le serveur a répondu " + reponse.status + ".");
            }
            if (!donnees) throw new Error("Réponse illisible du serveur.");
            return donnees;
          });
        })
        .then(function (donnees) {
          accueil.hidden = true;

          var monTour = { role: "moi", wolof: donnees.wolof };
          conversation.push(monTour);
          afficherMoi(donnees.wolof);

          var tourCoach = {
            role: "coach",
            coach: donnees.coach,
            anglais: donnees.anglais,
            nuance: donnees.nuance,
            audioBase64: donnees.audioBase64 || null
          };
          conversation.push(tourCoach);
          afficherCoach(tourCoach);

          sauver();
          setEtat("repos");
          dire("Wax ma ci wolof");
          descendre();

          // Le coach répond à voix haute : son wolof d'abord, puis la
          // phrase anglaise, l'une après l'autre. L'interrupteur d'entête
          // fait taire les deux ; les boutons de chaque message restent
          // toujours disponibles.
          if (voixActive) {
            parlerWolof(tourCoach.coach, function () {
              if (tourCoach.anglais) jouerAnglais(tourCoach);
            });
          }
        })
        .catch(function (err) {
          setEtat("repos");
          dire("Wax ma ci wolof");
          afficherSouci("Ça n'a pas marché", (err && err.message) || "Réessaie dans un instant.");
        });
    }

    /* ==================================================================
       10. COMMANDES
       ================================================================== */

    micro.addEventListener("click", function () {
      debloquerVoix();
      if (etat === "repos") demarrer();
      else if (etat === "enregistre") arreter();
    });

    btnVoix.addEventListener("click", function () {
      voixActive = !voixActive;
      try {
        localStorage.setItem("wolofglish.voix", voixActive ? "1" : "0");
      } catch (err) {
        // Stockage indisponible : le réglage vaut pour cette session.
      }
      btnVoix.textContent = voixActive ? "🔊" : "🔇";
      btnVoix.classList.toggle("actif", voixActive);
      btnVoix.setAttribute("aria-label", voixActive ? "Couper la voix du coach" : "Activer la voix du coach");
      if (!voixActive && window.speechSynthesis) window.speechSynthesis.cancel();
      if (!voixActive && audioEnCours) audioEnCours.pause();
      dire(voixActive ? "Le coach te répondra à voix haute" : "Le coach répondra par écrit");
    });

    btnReset.addEventListener("click", function () {
      if (conversation.length === 0) return;
      if (!confirm("Effacer toute la conversation et repartir de zéro ?")) return;
      conversation = [];
      sauver();
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (audioEnCours) audioEnCours.pause();
      redessiner();
      dire("Wax ma ci wolof");
    });

    window.addEventListener("pagehide", function () {
      libererMicro();
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    });

    // Certains navigateurs ne fournissent la liste des voix qu'après coup.
    if ("speechSynthesis" in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.addEventListener("voiceschanged", function () {});
    }

    btnVoix.textContent = voixActive ? "🔊" : "🔇";
    btnVoix.classList.toggle("actif", voixActive);

    setEtat("repos");
    redessiner();
  })();
  </script>
</body>
