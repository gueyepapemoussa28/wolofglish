<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f1720" />
  <title>Wolofglish — Ton coach d'anglais en wolof</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>" />
  <style>
    :root {
      --bg: #0f1720;
      --bg-soft: #17222e;
      --card: #1c2836;
      --card-border: #2b3a4c;
      --text: #eef3f8;
      --text-dim: #9aabbd;
      --accent: #f4a259;
      --accent-soft: rgba(244, 162, 89, 0.14);
      --green: #4fc3a1;
      --red: #e56b6f;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --barre: 148px;
    }

    * { box-sizing: border-box; }

    html, body { margin: 0; padding: 0; height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      position: relative;
    }

    /* ---------- En-tête ---------- */
    header {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      padding-top: calc(14px + env(safe-area-inset-top));
      border-bottom: 1px solid var(--card-border);
      background: var(--bg);
    }

    .marque { display: flex; align-items: center; gap: 10px; min-width: 0; }

    .pastille {
      width: 38px; height: 38px;
      border-radius: 12px;
      background: var(--accent-soft);
      display: flex; align-items: center; justify-content: center;
      font-size: 19px;
      flex: none;
    }

    .marque h1 {
      font-size: 17px;
      margin: 0;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .marque p {
      margin: 2px 0 0;
      font-size: 12px;
      color: var(--text-dim);
    }

    /* Le niveau estimé et ce qui reste à revoir : discret, jamais un verdict. */
    #badge {
      color: var(--accent);
      font-weight: 600;
    }

    .actions { display: flex; gap: 7px; flex: none; }

    .btn-entete {
      background: none;
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      border-radius: 10px;
      padding: 8px 11px;
      font-size: 12px;
      font-family: var(--font);
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-entete:active { color: var(--text); border-color: var(--accent); }

    #btnVoix { font-size: 15px; line-height: 1; padding: 7px 10px; }

    #btnVoix.actif { border-color: var(--accent); color: var(--accent); }

    /* ---------- Fil de conversation ---------- */
    #fil {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 20px 16px calc(var(--barre) + 20px);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .bulle { animation: apparait 0.32s ease both; max-width: 100%; }

    @keyframes apparait {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    /* Ce que l'utilisateur a dit */
    .moi {
      align-self: flex-end;
      max-width: 82%;
      background: var(--accent-soft);
      border: 1px solid rgba(244, 162, 89, 0.25);
      border-radius: 18px 18px 4px 18px;
      padding: 12px 15px;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
    }

    .moi.doute {
      border-color: rgba(229, 107, 111, 0.45);
      background: rgba(229, 107, 111, 0.1);
    }

    .corriger {
      display: block;
      margin-top: 8px;
      background: none;
      border: none;
      padding: 0;
      color: var(--text-dim);
      font-size: 12px;
      font-family: var(--font);
      text-decoration: underline;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .corriger.encours {
      color: var(--red);
      animation: battement 1.3s ease-in-out infinite;
    }

    /* Réponse du coach */
    .coach { align-self: flex-start; width: 100%; }

    .coach-entete {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 8px;
    }

    .coach-entete .point {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }

    .coach-dit {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 18px 18px 18px 4px;
      padding: 14px 16px;
      font-size: 16px;
      line-height: 1.6;
      position: relative;
    }

    .coach-dit .ecouter {
      margin-top: 10px;
      background: none;
      border: 1px solid var(--card-border);
      color: var(--text-dim);
      border-radius: 9px;
      padding: 5px 10px;
      font-size: 12px;
      font-family: var(--font);
      cursor: pointer;
    }

    .coach-dit .ecouter:active { color: var(--text); }

    /* La voix met quelques secondes à arriver : on le montre, plutôt que
       de laisser un silence que rien n'explique. */
    .vocalise {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      margin-top: 10px;
      font-size: 12px;
      color: var(--accent);
    }

    .vocalise span {
      width: 3px;
      height: 9px;
      border-radius: 2px;
      background: var(--accent);
      animation: barres 1s ease-in-out infinite;
    }

    .vocalise span:nth-child(2) { animation-delay: 0.15s; }
    .vocalise span:nth-child(3) { animation-delay: 0.3s; }
    .vocalise span:nth-child(4) { animation-delay: 0.45s; }

    @keyframes barres {
      0%, 100% { transform: scaleY(0.45); opacity: 0.5; }
      50%      { transform: scaleY(1.35); opacity: 1; }
    }

    /* La phrase anglaise à retenir */
    .phrase {
      margin-top: 12px;
      background: linear-gradient(150deg, rgba(244, 162, 89, 0.16), rgba(244, 162, 89, 0.06));
      border: 1px solid rgba(244, 162, 89, 0.32);
      border-radius: 16px;
      padding: 16px;
    }

    .phrase-titre {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .phrase-texte {
      font-size: 21px;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.01em;
      margin: 0;
    }

    .phrase button {
      margin-top: 12px;
      width: 100%;
      background: var(--accent);
      color: #12202c;
      border: none;
      border-radius: 11px;
      padding: 11px;
      font-size: 14px;
      font-weight: 700;
      font-family: var(--font);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .phrase button:active { transform: scale(0.98); }

    .phrase .repeter {
      background: none;
      border: 1px solid rgba(244, 162, 89, 0.45);
      color: var(--accent);
      margin-top: 8px;
    }

    .phrase .repeter.encours {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
      animation: battement 1.3s ease-in-out infinite;
    }

    @keyframes battement {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.72; }
    }

    /* Retour sur la prononciation */
    .essai {
      margin-top: 12px;
      background: var(--bg-soft);
      border: 1px solid var(--card-border);
      border-radius: 13px;
      padding: 13px 14px;
      animation: apparait 0.3s ease both;
    }

    .essai-tete { display: flex; align-items: center; gap: 10px; }

    .jauge {
      flex: 1;
      height: 7px;
      border-radius: 99px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }

    .jauge i {
      display: block;
      height: 100%;
      border-radius: 99px;
      transition: width 0.5s ease;
    }

    .essai-note {
      font-size: 14px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      flex: none;
    }

    .essai-entendu {
      margin: 10px 0 0;
      font-size: 13px;
      color: var(--text-dim);
      line-height: 1.5;
    }

    .essai-entendu b { color: var(--text); font-weight: 600; }

    .essai-retour {
      margin: 10px 0 0;
      font-size: 14px;
      line-height: 1.6;
    }

    .mots { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }

    .mot {
      background: rgba(229, 107, 111, 0.15);
      border: 1px solid rgba(229, 107, 111, 0.32);
      color: #ffd9da;
      border-radius: 8px;
      padding: 3px 9px;
      font-size: 13px;
      font-weight: 600;
    }

    /* La nuance wolof -> anglais */
    .nuance {
      margin-top: 12px;
      background: rgba(79, 195, 161, 0.09);
      border-left: 3px solid var(--green);
      border-radius: 0 12px 12px 0;
      padding: 12px 14px;
      font-size: 14px;
      line-height: 1.6;
      color: #cfe8e0;
    }

    .nuance-titre {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--green);
      margin-bottom: 6px;
    }

    /* Accueil */
    .accueil {
      margin: auto 0;
      text-align: center;
      padding: 30px 10px;
    }

    .accueil .grand { font-size: 46px; margin-bottom: 14px; }

    .accueil h2 {
      font-size: 21px;
      margin: 0 0 10px;
      font-weight: 700;
    }

    .accueil p {
      margin: 0 auto;
      max-width: 300px;
      color: var(--text-dim);
      font-size: 15px;
      line-height: 1.6;
    }

    /* Erreur */
    .souci {
      align-self: stretch;
      background: rgba(229, 107, 111, 0.12);
      border: 1px solid rgba(229, 107, 111, 0.34);
      border-radius: 14px;
      padding: 13px 15px;
      color: #ffd9da;
      font-size: 14px;
      line-height: 1.55;
    }

    .souci strong { display: block; margin-bottom: 3px; color: #fff; }

    /* ---------- Barre du micro ---------- */
    .barre {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      padding: 14px 16px calc(18px + env(safe-area-inset-bottom));
      background: linear-gradient(to top, var(--bg) 62%, rgba(15, 23, 32, 0));
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;
      pointer-events: none;
    }

    .barre > * { pointer-events: auto; }

    .micro-zone {
      position: relative;
      width: 76px; height: 76px;
      display: flex; align-items: center; justify-content: center;
    }

    .onde {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--accent);
      opacity: 0;
      pointer-events: none;
    }

    body.enregistre .onde { animation: onde 1.8s ease-out infinite; }
    body.enregistre .onde.retard { animation-delay: 0.9s; }

    @keyframes onde {
      0% { transform: scale(0.8); opacity: 0.4; }
      100% { transform: scale(1.5); opacity: 0; }
    }

    #micro {
      position: relative;
      width: 68px; height: 68px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      background: linear-gradient(160deg, #f6b478, var(--accent));
      color: #12202c;
      box-shadow: 0 10px 26px rgba(244, 162, 89, 0.3);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.18s, background 0.25s, box-shadow 0.25s;
      -webkit-tap-highlight-color: transparent;
    }

    #micro:active { transform: scale(0.93); }

    #micro:disabled {
      cursor: not-allowed;
      background: linear-gradient(160deg, #3a4a5c, #2b3a4c);
      color: var(--text-dim);
      box-shadow: none;
    }

    body.enregistre #micro {
      background: linear-gradient(160deg, #f08a8e, var(--red));
      box-shadow: 0 10px 26px rgba(229, 107, 111, 0.34);
      color: #fff;
    }

    #micro svg { width: 28px; height: 28px; }

    .roue {
      width: 25px; height: 25px;
      border: 3px solid rgba(255, 255, 255, 0.25);
      border-top-color: var(--text);
      border-radius: 50%;
      animation: tourne 0.9s linear infinite;
    }

    @keyframes tourne { to { transform: rotate(360deg); } }

    /* Mode appel : le micro reste ouvert, l'app détecte quand on parle. */
    .rangee {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    #appel {
      width: 46px; height: 46px;
      border-radius: 50%;
      border: 1px solid var(--card-border);
      background: var(--bg-soft);
      color: var(--text-dim);
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, color 0.2s, border-color 0.2s;
      -webkit-tap-highlight-color: transparent;
      flex: none;
    }

    #appel:active { transform: scale(0.93); }

    body.en-appel #appel {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }

    /* Pendant l'appel, le micro cède la place à un témoin d'état. */
    body.en-appel #micro { display: none; }

    .temoin {
      width: 68px; height: 68px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      background: var(--bg-soft);
      border: 2px solid var(--card-border);
      transition: border-color 0.3s, background 0.3s;
    }

    body.en-appel .temoin { display: flex; }

    .temoin i {
      width: 4px;
      border-radius: 3px;
      background: var(--text-dim);
      margin: 0 2px;
      height: 12px;
      transition: height 0.12s ease, background 0.3s;
    }

    /* J'écoute : les barres suivent ta voix. */
    body.en-appel.ecoute .temoin { border-color: var(--accent); }
    body.en-appel.ecoute .temoin i { background: var(--accent); }

    /* Il réfléchit. */
    body.en-appel.reflechit .temoin { border-color: var(--text-dim); }

    /* Il parle. */
    body.en-appel.repond .temoin { border-color: var(--green); background: rgba(79,195,161,0.12); }
    body.en-appel.repond .temoin i { background: var(--green); animation: barres 0.9s ease-in-out infinite; }
    body.en-appel.repond .temoin i:nth-child(2) { animation-delay: 0.12s; }
    body.en-appel.repond .temoin i:nth-child(3) { animation-delay: 0.24s; }
    body.en-appel.repond .temoin i:nth-child(4) { animation-delay: 0.36s; }

    #etat {
      font-size: 14px;
      color: var(--text-dim);
      text-align: center;
      min-height: 19px;
      font-variant-numeric: tabular-nums;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="app">

    <header>
      <div class="marque">
        <div class="pastille">🎙️</div>
        <div>
          <h1>Wolofglish</h1>
          <p id="badge" hidden></p>
          <p id="baseline">Sa coach anglais, ci wolof</p>
        </div>
      </div>
      <div class="actions">
        <button id="btnVoix" class="btn-entete actif" type="button" aria-label="Couper la voix du coach">🔊</button>
        <button id="btnReset" class="btn-entete" type="button">Recommencer</button>
      </div>
    </header>

    <main id="fil">
      <div class="accueil" id="accueil">
        <div class="grand">👋</div>
        <h2>Salamaalekum !</h2>
        <p>Man mi, sa coach anglais laa. Wax ma ci wolof — lu la neex — te dinaa la wax nan ñu koy wax ci anglais.</p>
      </div>
    </main>

    <div class="barre">
      <div class="rangee">
      <div class="micro-zone">
        <span class="onde"></span>
        <span class="onde retard"></span>
        <div class="temoin" id="temoin">
          <i></i><i></i><i></i><i></i>
        </div>
        <button id="micro" type="button" aria-label="Parler">
          <svg id="icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
          <span id="roue" class="roue" hidden></span>
        </button>
      </div>
      <button id="appel" type="button" aria-label="Passer en mode appel">📞</button>
      </div>
      <p id="etat">Wax ma ci wolof</p>
    </div>

  </div>

  <script>
  (function () {
    "use strict";

    /* ==================================================================
       1. CONFIGURATION
       ================================================================== */

    // Ouvert en local depuis un fichier, on tape le backend en ligne ;
    // servi par Vercel, on reste en chemin relatif.
    var API_BASE =
      location.protocol === "file:" || location.hostname === ""
        ? "https://wolofglish.vercel.app"
        : "";
    var API_URL = API_BASE + "/api/translate";
    var API_PRONONCIATION = API_BASE + "/api/prononciation";
    var API_VOIX = API_BASE + "/api/voix";

    var MAX_DUREE_MS = 45000;   // arrêt automatique de l'enregistrement
    var TAUX_CIBLE = 16000;     // fréquence native des modèles de parole
    var CLE_STOCKAGE = "wolofglish.conversation.v1";
    var CLE_PROFIL = "wolofglish.profil.v1";
    var MAX_TOURS_MEMOIRE = 12; // ce que le coach garde en tête

    /* ==================================================================
       2. ÉLÉMENTS
       ================================================================== */

    var fil = document.getElementById("fil");
    var accueil = document.getElementById("accueil");
    var micro = document.getElementById("micro");
    var icone = document.getElementById("icone");
    var roue = document.getElementById("roue");
    var etatEl = document.getElementById("etat");
    var btnReset = document.getElementById("btnReset");
    var btnVoix = document.getElementById("btnVoix");
    var badge = document.getElementById("badge");
    var appelBtn = document.getElementById("appel");
    var temoin = document.getElementById("temoin");
    var baseline = document.getElementById("baseline");

    /* ==================================================================
       3. ÉTAT
       ================================================================== */

    var mediaRecorder = null;
    var morceaux = [];
    var flux = null;
    var etat = "repos"; // repos | enregistre | envoie
    var surTermine = null;  // à qui remettre l'enregistrement une fois fini
    var boutonEssai = null; // bouton "Répète" actuellement en cours
    var chrono = null;
    var arretAuto = null;
    var debut = 0;
    var conversation = charger();
    var voixActive = chargerReglageVoix();
    var profil = chargerProfil();

    /* ==================================================================
       4. MÉMOIRE DE LA CONVERSATION
       ================================================================== */

    // Le profil de l'apprenant — niveau, fautes qui reviennent, structures
    // acquises — vit sur son appareil et accompagne chaque échange. Le
    // serveur ne garde rien : sa progression lui appartient.
    function chargerProfil() {
      try {
        var brut = localStorage.getItem(CLE_PROFIL);
        var lu = brut ? JSON.parse(brut) : null;
        return lu && typeof lu === "object" ? lu : null;
      } catch (err) {
        return null;
      }
    }

    function sauverProfil() {
      try {
        localStorage.setItem(CLE_PROFIL, JSON.stringify(profil));
      } catch (err) {
        // Stockage indisponible : le profil vaut pour cette session.
      }
    }

    var NIVEAUX = { debutant: "Débutant", intermediaire: "Intermédiaire", avance: "Avancé" };

    function afficherNiveau() {
      var niveau = profil && profil.niveau ? NIVEAUX[profil.niveau] : null;
      var fautes = profil && Array.isArray(profil.fautes) ? profil.fautes.length : 0;

      if (!niveau) {
        badge.hidden = true;
        baseline.hidden = false;
        return;
      }
      badge.hidden = false;
      baseline.hidden = true;
      badge.textContent = fautes > 0 ? niveau + " · " + fautes + " à revoir" : niveau;
    }

    function chargerReglageVoix() {
      try {
        return localStorage.getItem("wolofglish.voix") !== "0";
      } catch (err) {
        return true;
      }
    }

    function charger() {
      try {
        var brut = localStorage.getItem(CLE_STOCKAGE);
        var liste = brut ? JSON.parse(brut) : [];
        return Array.isArray(liste) ? liste : [];
      } catch (err) {
        return [];
      }
    }

    function sauver() {
      try {
        localStorage.setItem(CLE_STOCKAGE, JSON.stringify(conversation.slice(-40)));
      } catch (err) {
        // Navigation privée ou stockage plein : la conversation vit
        // alors le temps de la session, sans que rien ne casse.
      }
    }

    // Ce qu'on renvoie au coach pour qu'il garde le fil.
    function historiquePourCoach() {
      return conversation.slice(-MAX_TOURS_MEMOIRE).map(function (tour) {
        if (tour.role === "moi") {
          return { role: "user", texte: tour.wolof };
        }
        var texte = tour.coach;
        if (tour.anglais) texte += " [phrase enseignée : " + tour.anglais + "]";
        return { role: "coach", texte: texte };
      });
    }

    /* ==================================================================
       5. AFFICHAGE DU FIL
       ================================================================== */

    function creer(balise, classe, texte) {
      var el = document.createElement(balise);
      if (classe) el.className = classe;
      if (texte) el.textContent = texte;
      return el;
    }

    function afficherMoi(tour) {
      var texte = typeof tour === "string" ? tour : tour.wolof;
      var bulle = creer("div", "bulle moi");
      bulle.appendChild(document.createTextNode(texte));

      if (tour && tour.doute) {
        bulle.classList.add("doute");
      }

      // Le coach se trompe parfois d'écoute. Plutôt que de le laisser partir
      // sur une phrase qu'on n'a pas dite, on peut la lui refuser : il
      // réécoutera en sachant que sa première lecture était fausse.
      if (tour && typeof tour !== "string") {
        var corriger = creer("button", "corriger", tour.doute
          ? "Ce n'est pas ça ? Redis-le"
          : "Ce n'est pas ce que j'ai dit");

        corriger.addEventListener("click", function () {
          if (etat === "enregistre" && boutonEssai === corriger) {
            arreter("Coach bi dafay déglu…");
            return;
          }
          if (etat !== "repos") return;

          debloquerVoix();
          if (window.speechSynthesis) window.speechSynthesis.cancel();
          if (audioEnCours) audioEnCours.pause();

          boutonEssai = corriger;
          corriger.textContent = "⏹ J'ai fini";
          corriger.classList.add("encours");

          demarrer(function (blob) {
            corriger.textContent = "Ce n'est pas ce que j'ai dit";
            corriger.classList.remove("encours");
            boutonEssai = null;
            reprendre(blob, tour.wolof);
          });
        });

        bulle.appendChild(corriger);
      }

      fil.appendChild(bulle);
      return bulle;
    }

    function afficherCoach(tour) {
      var bloc = creer("div", "bulle coach");

      var entete = creer("div", "coach-entete");
      entete.appendChild(creer("span", "point"));
      entete.appendChild(document.createTextNode("Coach bi"));
      bloc.appendChild(entete);

      var dit = creer("div", "coach-dit");
      dit.appendChild(creer("p", null, tour.coach));

      // Le wolof n'est synthétisé par aucun service : on le fait lire par
      // une voix française. L'orthographe wolof étant proche du français,
      // le résultat reste compréhensible.
      if ("speechSynthesis" in window && tour.coach) {
        var ecouter = creer("button", "ecouter", "🔊 Écouter en wolof");
        ecouter.addEventListener("click", function () {
          direWolof(tour.coach, tour.prononciation);
        });
        dit.appendChild(ecouter);
      }
      // Zone réservée au signal « la voix arrive », remplie par l'appelant.
      var signal = creer("div", "vocalise");
      signal.hidden = true;
      signal.appendChild(creer("span"));
      signal.appendChild(creer("span"));
      signal.appendChild(creer("span"));
      signal.appendChild(creer("span"));
      signal.appendChild(document.createTextNode("le coach prépare sa voix…"));
      dit.appendChild(signal);
      bloc.signalVoix = signal;

      bloc.appendChild(dit);

      if (tour.anglais) {
        var phrase = creer("div", "phrase");
        phrase.appendChild(creer("div", "phrase-titre", "À dire en anglais"));
        phrase.appendChild(creer("p", "phrase-texte", tour.anglais));

        var bouton = creer("button", null, "🔊 Écouter la prononciation");
        bouton.addEventListener("click", function () {
          direAnglais(tour.anglais);
        });
        phrase.appendChild(bouton);

        // L'élève répète la phrase ; le coach écoute et corrige.
        var zoneEssai = creer("div", "essai");
        zoneEssai.hidden = true;

        var repeter = creer("button", "repeter", "🎤 Répète après moi");
        repeter.addEventListener("click", function () {
          if (etat === "enregistre" && boutonEssai === repeter) {
            arreter("Coach bi dafay déglu…");
            return;
          }
          if (etat !== "repos") return;

          debloquerVoix();
          if (window.speechSynthesis) window.speechSynthesis.cancel();
          if (audioEnCours) audioEnCours.pause();

          boutonEssai = repeter;
          repeter.textContent = "⏹ J'ai fini";
          repeter.classList.add("encours");

          demarrer(function (blob) {
            evaluerEssai(blob, tour, zoneEssai, repeter);
          });
        });

        phrase.appendChild(repeter);
        phrase.appendChild(zoneEssai);

        if (tour.essai) rendreEssai(zoneEssai, tour.essai);

        bloc.appendChild(phrase);
      }

      if (tour.nuance) {
        var nuance = creer("div", "nuance");
        nuance.appendChild(creer("div", "nuance-titre", "Xam-xam — à retenir"));
        nuance.appendChild(creer("p", null, tour.nuance));
        bloc.appendChild(nuance);
      }

      fil.appendChild(bloc);
      return bloc;
    }

    function afficherSouci(titre, message) {
      var boite = creer("div", "bulle souci");
      boite.appendChild(creer("strong", null, titre));
      boite.appendChild(document.createTextNode(message));
      fil.appendChild(boite);
      descendre();
    }

    function descendre() {
      requestAnimationFrame(function () {
        fil.scrollTop = fil.scrollHeight;
      });
    }

    function redessiner() {
      Array.prototype.slice.call(fil.querySelectorAll(".bulle")).forEach(function (el) {
        el.remove();
      });
      accueil.hidden = conversation.length > 0;
      conversation.forEach(function (tour) {
        if (tour.role === "moi") afficherMoi(tour);
        else afficherCoach(tour);
      });
      descendre();
    }

    /* ==================================================================
       6. LA VOIX
       Le serveur fabrique les voix à part (/api/voix) : le texte s'affiche
       sans attendre la synthèse. Si elle n'arrive pas, celle du navigateur
       prend le relais — le coach n'est jamais muet.
       ================================================================== */

    var audioEnCours = null;

    function jouerUrl(url, ensuite) {
      if (audioEnCours) audioEnCours.pause();
      audioEnCours = new Audio(url);

      var suivi = false;
      function poursuivre() {
        if (suivi) return;
        suivi = true;
        if (ensuite) ensuite();
      }
      audioEnCours.addEventListener("ended", poursuivre);
      audioEnCours.addEventListener("error", poursuivre);

      var lecture = audioEnCours.play();
      if (lecture && lecture.catch) lecture.catch(poursuivre);
    }

    // Demande la voix au serveur. Renvoie une URL lisible, ou null.
    function chargerVoix(texte, langue, secours) {
      if (!texte) return Promise.resolve(null);

      return fetch(API_VOIX, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texte: texte, langue: langue, secours: secours || "" })
      })
        .then(function (reponse) {
          return reponse.ok ? reponse.blob() : null;
        })
        .then(function (blob) {
          return blob && blob.size > 500 ? URL.createObjectURL(blob) : null;
        })
        .catch(function () {
          return null; // le navigateur lira lui-même
        });
    }

    function parler(texte, langue, vitesse, ensuite) {
      if (!("speechSynthesis" in window) || !texte) {
        if (ensuite) ensuite();
        return;
      }

      var enonce = new SpeechSynthesisUtterance(texte);
      enonce.lang = langue;
      enonce.rate = vitesse || 1;

      var prefixe = langue.split("-")[0];
      var voix = (window.speechSynthesis.getVoices() || []).filter(function (v) {
        return v.lang && v.lang.toLowerCase().indexOf(prefixe) === 0;
      });
      if (voix.length > 0) enonce.voice = voix[0];

      var suivi = false;
      function poursuivre() {
        if (suivi) return;
        suivi = true;
        if (ensuite) ensuite();
      }
      enonce.onend = poursuivre;
      enonce.onerror = poursuivre;

      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(enonce);
    }

    // Le wolof : voix de Gemini si elle arrive, sinon une voix française lisant
    // l'orthographe réécrite — le wolof s'écrivant selon des conventions
    // proches du français, l'approximation reste compréhensible.
    function direWolof(texte, secours, ensuite, promesse) {
      (promesse || chargerVoix(texte, "wolof", secours)).then(function (url) {
        if (url) jouerUrl(url, ensuite);
        else parler(secours || texte, "fr-FR", 0.95, ensuite);
      });
    }

    function direAnglais(texte, ensuite, promesse) {
      (promesse || chargerVoix(texte, "anglais")).then(function (url) {
        if (url) jouerUrl(url, ensuite);
        else parler(texte, "en-US", 0.9, ensuite);
      });
    }

    // iOS n'autorise la synthèse qu'après un geste de l'utilisateur : on la
    // débloque dès le premier appui sur le micro, avant tout appel réseau.
    var voixDebloquee = false;
    function debloquerVoix() {
      if (voixDebloquee || !("speechSynthesis" in window)) return;
      voixDebloquee = true;
      try {
        var vide = new SpeechSynthesisUtterance(" ");
        vide.volume = 0;
        window.speechSynthesis.speak(vide);
      } catch (err) {
        // Sans importance : les boutons d'écoute restent disponibles.
      }
    }

    /* ==================================================================
       7. CONVERSION EN WAV 16 kHz MONO
       Les moteurs de parole attendent du wav ; le navigateur enregistre
       du webm (Chrome, Android) ou du mp4 (Safari, iPhone).
       ================================================================== */

    function encoderWav(echantillons, taux) {
      var tailleDonnees = echantillons.length * 2;
      var tampon = new ArrayBuffer(44 + tailleDonnees);
      var vue = new DataView(tampon);

      function ecrire(position, texte) {
        for (var i = 0; i < texte.length; i++) vue.setUint8(position + i, texte.charCodeAt(i));
      }

      ecrire(0, "RIFF");
      vue.setUint32(4, 36 + tailleDonnees, true);
      ecrire(8, "WAVE");
      ecrire(12, "fmt ");
      vue.setUint32(16, 16, true);
      vue.setUint16(20, 1, true);
      vue.setUint16(22, 1, true);
      vue.setUint32(24, taux, true);
      vue.setUint32(28, taux * 2, true);
      vue.setUint16(32, 2, true);
      vue.setUint16(34, 16, true);
      ecrire(36, "data");
      vue.setUint32(40, tailleDonnees, true);

      var position = 44;
      for (var j = 0; j < echantillons.length; j++) {
        var valeur = Math.max(-1, Math.min(1, echantillons[j]));
        vue.setInt16(position, valeur < 0 ? valeur * 0x8000 : valeur * 0x7fff, true);
        position += 2;
      }
      return new Blob([tampon], { type: "audio/wav" });
    }

    function convertirEnWav(blob) {
      var Contexte = window.AudioContext || window.webkitAudioContext;
      var HorsEcran = window.OfflineAudioContext || window.webkitOfflineAudioContext;
      if (!Contexte || !HorsEcran) return Promise.reject(new Error("Web Audio indisponible"));

      return blob.arrayBuffer().then(function (brut) {
        var contexte = new Contexte();
        return new Promise(function (ok, ko) {
          contexte.decodeAudioData(brut, ok, ko); // forme comprise par tous les Safari
        })
          .then(function (decode) {
            if (contexte.close) contexte.close();
            var longueur = Math.max(1, Math.ceil(decode.duration * TAUX_CIBLE));
            var horsEcran = new HorsEcran(1, longueur, TAUX_CIBLE);
            var source = horsEcran.createBufferSource();
            source.buffer = decode;
            source.connect(horsEcran.destination);
            source.start(0);

            var rendu = horsEcran.startRendering();
            if (rendu && rendu.then) return rendu;
            return new Promise(function (ok) {
              horsEcran.oncomplete = function (evt) { ok(evt.renderedBuffer); };
            });
          })
          .then(function (fini) {
            return encoderWav(fini.getChannelData(0), TAUX_CIBLE);
          });
      });
    }

    function versBase64(blob) {
      return blob.arrayBuffer().then(function (tampon) {
        var octets = new Uint8Array(tampon);
        var binaire = "";
        var paquet = 0x8000;
        for (var i = 0; i < octets.length; i += paquet) {
          binaire += String.fromCharCode.apply(null, octets.subarray(i, i + paquet));
        }
        return btoa(binaire);
      });
    }

    /* ==================================================================
       8. ENREGISTREMENT
       ================================================================== */

    function setEtat(nouveau) {
      etat = nouveau;
      document.body.classList.toggle("enregistre", nouveau === "enregistre");
      var charge = nouveau === "envoie";
      roue.hidden = !charge;
      icone.style.display = charge ? "none" : "block";
      micro.disabled = charge;
      micro.setAttribute(
        "aria-label",
        nouveau === "enregistre" ? "Arrêter et envoyer" : nouveau === "envoie" ? "Le coach réfléchit" : "Parler"
      );
    }

    function dire(texte) { etatEl.textContent = texte; }

    function meilleurFormat() {
      var liste = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg;codecs=opus"];
      if (typeof MediaRecorder === "undefined" || !MediaRecorder.isTypeSupported) return "";
      for (var i = 0; i < liste.length; i++) {
        if (MediaRecorder.isTypeSupported(liste[i])) return liste[i];
      }
      return "";
    }

    function demarrer(destinataire) {
      surTermine = destinataire || null;
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        afficherSouci("Micro indisponible", "Ton navigateur ne permet pas d'enregistrer. Essaie Chrome ou Safari à jour, en HTTPS.");
        return;
      }

      dire("J'ouvre le micro…");

      navigator.mediaDevices
        .getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
        .then(function (micFlux) {
          flux = micFlux;
          morceaux = [];

          var format = meilleurFormat();
          try {
            mediaRecorder = format ? new MediaRecorder(flux, { mimeType: format }) : new MediaRecorder(flux);
          } catch (e) {
            mediaRecorder = new MediaRecorder(flux);
          }

          mediaRecorder.addEventListener("dataavailable", function (evt) {
            if (evt.data && evt.data.size > 0) morceaux.push(evt.data);
          });

          mediaRecorder.addEventListener("stop", function () {
            libererMicro();
            var blob = new Blob(morceaux, { type: mediaRecorder.mimeType || "audio/webm" });
            morceaux = [];
            var destinataire = surTermine || envoyer;
            surTermine = null;
            destinataire(blob);
          });

          mediaRecorder.start();
          setEtat("enregistre");
          debut = Date.now();
          dire("J'écoute… appuie pour envoyer");

          chrono = setInterval(function () {
            var s = Math.floor((Date.now() - debut) / 1000);
            dire("J'écoute… " + String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(s % 60).padStart(2, "0"));
          }, 500);

          arretAuto = setTimeout(function () {
            if (etat === "enregistre") arreter();
          }, MAX_DUREE_MS);
        })
        .catch(function (err) {
          setEtat("repos");
          dire("Wax ma ci wolof");
          if (err && (err.name === "NotAllowedError" || err.name === "SecurityError")) {
            afficherSouci("Micro bloqué", "Autorise l'accès au micro dans les réglages de ton navigateur, puis réessaie.");
          } else if (err && err.name === "NotFoundError") {
            afficherSouci("Aucun micro détecté", "Vérifie les réglages de ton appareil.");
          } else {
            afficherSouci("Impossible d'ouvrir le micro", (err && err.message) || "Erreur inconnue.");
          }
        });
    }

    function arreter(message) {
      clearTimeout(arretAuto);
      clearInterval(chrono);
      arretAuto = null;
      chrono = null;
      setEtat("envoie");
      dire(message || "Coach bi dafay xalaat…");
      if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
    }

    function libererMicro() {
      if (flux) {
        flux.getTracks().forEach(function (piste) { piste.stop(); });
        flux = null;
      }
    }

    /* ==================================================================
       9. ÉCHANGE AVEC LE COACH
       ================================================================== */

    // Rejoue le dernier tour : le coach avait mal entendu, on retire sa
    // réponse et sa mauvaise transcription avant de lui redonner la parole.
    function reprendre(blob, transcriptionRefusee) {
      while (conversation.length > 0 && conversation[conversation.length - 1].role === "coach") {
        conversation.pop();
      }
      if (conversation.length > 0 && conversation[conversation.length - 1].role === "moi") {
        conversation.pop();
      }
      sauver();
      redessiner();
      envoyer(blob, transcriptionRefusee);
    }

    function envoyer(blob, transcriptionRefusee) {
      if (!blob || blob.size < 1000) {
        setEtat("repos");
        if (appel.actif) {
          reprendreEcoute();
        } else {
          dire("Je n'ai rien entendu, réessaie");
        }
        return;
      }

      var memoire = historiquePourCoach();
      if (transcriptionRefusee) dire("Coach bi dafay déglu bu baax…");

      convertirEnWav(blob)
        .catch(function () { return blob; })
        .then(function (pret) {
          var type = (pret.type || "audio/wav").split(";")[0];
          return versBase64(pret).then(function (base64) {
            return fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                audioBase64: base64,
                mimeType: type,
                historique: memoire,
                profil: profil,
                rejete: transcriptionRefusee || ""
              })
            });
          });
        })
        .then(function (reponse) {
          return reponse.text().then(function (texte) {
            var donnees = null;
            try { donnees = JSON.parse(texte); } catch (e) { donnees = null; }
            if (!reponse.ok) {
              var bouts = donnees ? [donnees.error, donnees.details].filter(Boolean) : [];
              throw new Error(bouts.join(" — ").slice(0, 400) || texte.slice(0, 300) || "Le serveur a répondu " + reponse.status + ".");
            }
            if (!donnees) throw new Error("Réponse illisible du serveur.");
            return donnees;
          });
        })
        .then(function (donnees) {
          accueil.hidden = true;

          var monTour = { role: "moi", wolof: donnees.wolof, doute: donnees.doute === true };
          conversation.push(monTour);
          afficherMoi(monTour);

          var blocCoach = null;
          var tourCoach = {
            role: "coach",
            coach: donnees.coach,
            prononciation: donnees.prononciation || donnees.coach,
            anglais: donnees.anglais,
            nuance: donnees.nuance
          };
          conversation.push(tourCoach);
          blocCoach = afficherCoach(tourCoach);

          if (donnees.profil) {
            profil = donnees.profil;
            sauverProfil();
            afficherNiveau();
          }

          sauver();
          setEtat("repos");
          descendre();
          // En appel, c'est la fin de sa réponse qui rendra la parole.
          dire(appel.actif ? "Coach bi dafay wax…" : "Wax ma ci wolof");

          // Le coach répond à voix haute. Les deux voix sont demandées en
          // même temps et jouées l'une après l'autre : l'anglaise est déjà
          // prête quand le wolof se termine. La synthèse wolof prenant
          // quelques secondes, on signale l'attente au lieu de laisser un
          // silence que rien n'explique.
          // En mode appel, la fin de la lecture rend la parole à l'apprenant.
          function finLecture() {
            if (appel.actif) reprendreEcoute();
          }

          if (voixActive) {
            var signal = blocCoach && blocCoach.signalVoix;
            var masquerSignal = function () {
              if (signal) signal.hidden = true;
            };
            if (signal) signal.hidden = false;

            var vWolof = chargerVoix(tourCoach.coach, "wolof", tourCoach.prononciation);
            var vAnglais = tourCoach.anglais
              ? chargerVoix(tourCoach.anglais, "anglais")
              : null;

            vWolof.then(masquerSignal, masquerSignal);
            if (appel.actif) phaseAppel("repond");

            direWolof(tourCoach.coach, tourCoach.prononciation, function () {
              masquerSignal();
              if (tourCoach.anglais) direAnglais(tourCoach.anglais, finLecture, vAnglais);
              else finLecture();
            }, vWolof);
          } else {
            finLecture();
          }

        })
        .catch(function (err) {
          setEtat("repos");
          afficherSouci("Ça n'a pas marché", (err && err.message) || "Réessaie dans un instant.");
          if (appel.actif) reprendreEcoute();
          else dire("Wax ma ci wolof");
        });
    }

    /* ==================================================================
       10. « RÉPÈTE APRÈS MOI » — ÉVALUATION DE LA PRONONCIATION
       ================================================================== */

    function couleurScore(score) {
      if (score >= 75) return "#4fc3a1";
      if (score >= 40) return "#f4a259";
      return "#e56b6f";
    }

    function rendreEssai(zone, essai) {
      zone.innerHTML = "";
      zone.hidden = false;

      var tete = creer("div", "essai-tete");
      var jauge = creer("div", "jauge");
      var barre = creer("i");
      barre.style.width = essai.score + "%";
      barre.style.background = couleurScore(essai.score);
      jauge.appendChild(barre);
      tete.appendChild(jauge);

      var note = creer("span", "essai-note", essai.score + " / 100");
      note.style.color = couleurScore(essai.score);
      tete.appendChild(note);
      zone.appendChild(tete);

      var entendu = creer("p", "essai-entendu");
      entendu.appendChild(document.createTextNode("J'ai entendu : "));
      entendu.appendChild(creer("b", null, "« " + essai.entendu + " »"));
      zone.appendChild(entendu);

      if (essai.retour) {
        zone.appendChild(creer("p", "essai-retour", essai.retour));
        if ("speechSynthesis" in window) {
          var ecouter = creer("button", "ecouter", "🔊 Écouter le conseil");
          ecouter.addEventListener("click", function () {
            direWolof(essai.retour, essai.prononciation);
          });
          zone.appendChild(ecouter);
        }
      }

      if (essai.motsACorriger && essai.motsACorriger.length) {
        var mots = creer("div", "mots");
        essai.motsACorriger.forEach(function (mot) {
          mots.appendChild(creer("span", "mot", mot));
        });
        zone.appendChild(mots);
      }
    }

    function evaluerEssai(blob, tour, zone, bouton) {
      function finir() {
        bouton.textContent = "🎤 Répète après moi";
        bouton.classList.remove("encours");
        boutonEssai = null;
        setEtat("repos");
        dire("Wax ma ci wolof");
      }

      if (!blob || blob.size < 800) {
        finir();
        zone.hidden = false;
        zone.textContent = "Je n'ai rien entendu, réessaie.";
        return;
      }

      convertirEnWav(blob)
        .catch(function () { return blob; })
        .then(function (pret) {
          var type = (pret.type || "audio/wav").split(";")[0];
          return versBase64(pret).then(function (base64) {
            return fetch(API_PRONONCIATION, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ audioBase64: base64, mimeType: type, phrase: tour.anglais })
            });
          });
        })
        .then(function (reponse) {
          return reponse.text().then(function (texte) {
            var donnees = null;
            try { donnees = JSON.parse(texte); } catch (e) { donnees = null; }
            if (!reponse.ok) {
              var bouts = donnees ? [donnees.error, donnees.details].filter(Boolean) : [];
              throw new Error(bouts.join(" — ").slice(0, 300) || "Le serveur a répondu " + reponse.status + ".");
            }
            if (!donnees) throw new Error("Réponse illisible du serveur.");
            return donnees;
          });
        })
        .then(function (essai) {
          tour.essai = essai;   // conservé pour survivre à un rechargement
          sauver();
          rendreEssai(zone, essai);
          finir();
          descendre();
          if (voixActive && essai.retour) {
            direWolof(essai.retour, essai.prononciation);
          }
        })
        .catch(function (err) {
          finir();
          zone.hidden = false;
          zone.textContent = (err && err.message) || "Réessaie dans un instant.";
        });
    }

    /* ==================================================================
       11. MODE APPEL
       Le micro reste ouvert et l'app décide elle-même quand tu as fini de
       parler, en mesurant le niveau sonore. Pas de temps réel ici : on
       réutilise tout le pipeline existant, donc la transcription, le
       profil et la correction de prononciation continuent de fonctionner.
       ================================================================== */

    var SEUIL_PLANCHER = 0.012;  // en deçà, c'est du bruit de fond
    var SILENCE_FIN_MS = 1100;   // silence qui signe la fin d'une phrase
    var PAROLE_MIN_MS = 350;     // en deçà, c'est un bruit, pas une phrase
    var PAROLE_MAX_MS = 20000;   // au-delà, on envoie sans attendre le silence

    var appel = {
      actif: false,
      flux: null,
      contexte: null,
      analyseur: null,
      donnees: null,
      recorder: null,
      morceaux: [],
      ecoute: false,
      aParle: false,
      debutEcoute: 0,
      parleDepuis: 0,
      silenceDepuis: 0,
      seuil: SEUIL_PLANCHER,
      boucle: null
    };

    function phaseAppel(phase) {
      document.body.classList.toggle("ecoute", phase === "ecoute");
      document.body.classList.toggle("reflechit", phase === "reflechit");
      document.body.classList.toggle("repond", phase === "repond");
    }

    function niveauSonore() {
      appel.analyseur.getByteTimeDomainData(appel.donnees);
      var somme = 0;
      for (var i = 0; i < appel.donnees.length; i++) {
        var ecart = (appel.donnees[i] - 128) / 128;
        somme += ecart * ecart;
      }
      return Math.sqrt(somme / appel.donnees.length);
    }

    function animerTemoin(niveau) {
      var barres = temoin.querySelectorAll("i");
      for (var i = 0; i < barres.length; i++) {
        var hauteur = 8 + Math.min(1, niveau / 0.14) * 26 * (0.6 + Math.random() * 0.6);
        barres[i].style.height = Math.round(hauteur) + "px";
      }
    }

    function demarrerCapture() {
      appel.morceaux = [];
      var format = meilleurFormat();
      appel.format = format;
      try {
        appel.recorder = format
          ? new MediaRecorder(appel.flux, { mimeType: format })
          : new MediaRecorder(appel.flux);
      } catch (e) {
        appel.recorder = new MediaRecorder(appel.flux);
      }

      appel.recorder.addEventListener("dataavailable", function (evt) {
        if (evt.data && evt.data.size > 0) appel.morceaux.push(evt.data);
      });

      appel.recorder.addEventListener("stop", function () {
        var blob = new Blob(appel.morceaux, { type: format || "audio/webm" });
        var contientParole = appel.aParle; // lu à l'arrêt, pas au démarrage
        appel.morceaux = [];
        if (appel.actif && contientParole) envoyer(blob);
      });

      appel.recorder.start();
    }

    function arreterCapture() {
      if (appel.recorder && appel.recorder.state !== "inactive") {
        appel.recorder.stop();
      }
      appel.recorder = null;
    }

    function surveiller() {
      if (!appel.actif) return;

      // On n'écoute pas pendant que le coach parle : sinon il s'entendrait
      // lui-même et se répondrait.
      if (!appel.ecoute) {
        appel.boucle = setTimeout(surveiller, 120);
        return;
      }

      var niveau = niveauSonore();
      var maintenant = Date.now();
      animerTemoin(niveau);

      if (niveau > appel.seuil) {
        if (!appel.parleDepuis) {
          appel.parleDepuis = maintenant;
          appel.aParle = true;
        }
        appel.silenceDepuis = 0;
      } else if (appel.parleDepuis) {
        if (!appel.silenceDepuis) appel.silenceDepuis = maintenant;
      }

      var assezParle = appel.parleDepuis && maintenant - appel.parleDepuis > PAROLE_MIN_MS;
      var silenceFini = appel.silenceDepuis && maintenant - appel.silenceDepuis > SILENCE_FIN_MS;
      var tropLong = appel.parleDepuis && maintenant - appel.parleDepuis > PAROLE_MAX_MS;

      if ((assezParle && silenceFini) || tropLong) {
        appel.ecoute = false;
        appel.parleDepuis = 0;
        appel.silenceDepuis = 0;
        phaseAppel("reflechit");
        dire("Coach bi dafay xalaat…");
        arreterCapture(); // le gestionnaire d'arrêt se charge de l'envoi
      } else if (appel.silenceDepuis && !assezParle && maintenant - appel.silenceDepuis > SILENCE_FIN_MS) {
        // Un bruit bref, pas une phrase : on repart sur un enregistrement neuf.
        appel.parleDepuis = 0;
        appel.silenceDepuis = 0;
        rafraichirCapture();
      } else if (!appel.parleDepuis && maintenant - appel.debutEcoute > 25000) {
        // Long silence : on évite de laisser grossir un enregistrement vide.
        rafraichirCapture();
      }

      appel.boucle = setTimeout(surveiller, 60);
    }

    function reprendreEcoute() {
      if (!appel.actif) return;
      appel.ecoute = true;
      appel.aParle = false;
      appel.parleDepuis = 0;
      appel.silenceDepuis = 0;
      appel.debutEcoute = Date.now();
      phaseAppel("ecoute");
      dire("Wax ma, dama lay déglu…");

      // On enregistre AVANT que tu parles. Attendre d'avoir détecté ta voix
      // ferait perdre ta première syllabe, et le coach devinerait le reste.
      demarrerCapture();
    }

    // Repart sur un enregistrement neuf sans rien envoyer : utile quand
    // l'écoute dure sans que personne ne parle.
    function rafraichirCapture() {
      appel.aParle = false; // avant l'arrêt : ce morceau ne doit pas partir
      arreterCapture();
      appel.debutEcoute = Date.now();
      demarrerCapture();
    }

    function demarrerAppel() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        afficherSouci("Micro indisponible", "Ton navigateur ne permet pas l'appel. Essaie Chrome ou Safari à jour.");
        return;
      }

      debloquerVoix();
      dire("J'ouvre le micro…");

      navigator.mediaDevices
        .getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } })
        .then(function (flux) {
          appel.flux = flux;

          var Contexte = window.AudioContext || window.webkitAudioContext;
          appel.contexte = new Contexte();
          if (appel.contexte.resume) appel.contexte.resume();

          var source = appel.contexte.createMediaStreamSource(flux);
          appel.analyseur = appel.contexte.createAnalyser();
          appel.analyseur.fftSize = 1024;
          source.connect(appel.analyseur);
          appel.donnees = new Uint8Array(appel.analyseur.fftSize);

          appel.actif = true;
          document.body.classList.add("en-appel");
          appelBtn.setAttribute("aria-label", "Raccrocher");

          // On écoute le bruit ambiant une seconde pour régler le seuil :
          // une chambre calme et une rue de Dakar n'ont pas le même fond.
          dire("Un instant, j'écoute la pièce…");
          var mesures = [];
          var calibrage = setInterval(function () {
            mesures.push(niveauSonore());
          }, 50);

          setTimeout(function () {
            clearInterval(calibrage);
            mesures.sort(function (a, b) { return a - b; });
            var fond = mesures[Math.floor(mesures.length / 2)] || 0;
            appel.seuil = Math.max(SEUIL_PLANCHER, fond * 3);
            reprendreEcoute();
            surveiller();
          }, 1000);
        })
        .catch(function (err) {
          if (err && (err.name === "NotAllowedError" || err.name === "SecurityError")) {
            afficherSouci("Micro bloqué", "Autorise l'accès au micro, puis réessaie.");
          } else {
            afficherSouci("Appel impossible", (err && err.message) || "Erreur inconnue.");
          }
          terminerAppel();
        });
    }

    function terminerAppel() {
      appel.actif = false;
      appel.ecoute = false;
      clearTimeout(appel.boucle);
      arreterCapture();

      if (appel.flux) {
        appel.flux.getTracks().forEach(function (piste) { piste.stop(); });
        appel.flux = null;
      }
      if (appel.contexte && appel.contexte.close) {
        appel.contexte.close();
        appel.contexte = null;
      }

      document.body.classList.remove("en-appel");
      phaseAppel(null);
      appelBtn.setAttribute("aria-label", "Passer en mode appel");
      setEtat("repos");
      dire("Wax ma ci wolof");
    }

    /* ==================================================================
       12. COMMANDES
       ================================================================== */

    micro.addEventListener("click", function () {
      debloquerVoix();
      if (etat === "repos") {
        demarrer();
      } else if (etat === "enregistre") {
        // Si un « Répète après moi » est en cours, c'est lui qu'on arrête.
        if (boutonEssai) {
          arreter("Coach bi dafay déglu…");
        } else {
          arreter();
        }
      }
    });

    appelBtn.addEventListener("click", function () {
      if (appel.actif) terminerAppel();
      else if (etat === "repos") demarrerAppel();
    });

    btnVoix.addEventListener("click", function () {
      voixActive = !voixActive;
      try {
        localStorage.setItem("wolofglish.voix", voixActive ? "1" : "0");
      } catch (err) {
        // Stockage indisponible : le réglage vaut pour cette session.
      }
      btnVoix.textContent = voixActive ? "🔊" : "🔇";
      btnVoix.classList.toggle("actif", voixActive);
      btnVoix.setAttribute("aria-label", voixActive ? "Couper la voix du coach" : "Activer la voix du coach");
      if (!voixActive && window.speechSynthesis) window.speechSynthesis.cancel();
      if (!voixActive && audioEnCours) audioEnCours.pause();
      dire(voixActive ? "Le coach te répondra à voix haute" : "Le coach répondra par écrit");
    });

    btnReset.addEventListener("click", function () {
      if (conversation.length === 0) return;
      if (!confirm("Effacer toute la conversation et repartir de zéro ?")) return;
      if (appel.actif) terminerAppel();
      conversation = [];
      profil = null;
      sauver();
      sauverProfil();
      afficherNiveau();
      if (window.speechSynthesis) window.speechSynthesis.cancel();
      if (audioEnCours) audioEnCours.pause();
      redessiner();
      dire("Wax ma ci wolof");
    });

    window.addEventListener("pagehide", function () {
      if (appel.actif) terminerAppel();
      libererMicro();
      if (window.speechSynthesis) window.speechSynthesis.cancel();
    });

    // Certains navigateurs ne fournissent la liste des voix qu'après coup.
    if ("speechSynthesis" in window) {
      window.speechSynthesis.getVoices();
      window.speechSynthesis.addEventListener("voiceschanged", function () {});
    }

    btnVoix.textContent = voixActive ? "🔊" : "🔇";
    btnVoix.classList.toggle("actif", voixActive);

    afficherNiveau();
    setEtat("repos");
    redessiner();
  })();
  </script>
</body>
</html>
